# Copy to .github/dependabot.yml. Add one block per package manager from dependabot-ecosystem.yml.
version: 2
updates:
  # Workflow actions are pinned to full SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      # CodeQL fails unless init and analyze run the same version.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
